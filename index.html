<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蕭淯庭｜個人簡介</title>
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans TC", "微軟正黑體", sans-serif;
      background-color: #e6f2ff; /* 淡藍色背景 */
      color: #333;
    }

    header {
      background: linear-gradient(to right, #1a73e8, #4fc3f7);
      color: white;
      text-align: center;
      padding: 30px 10px;
      font-size: 1.8rem;
      letter-spacing: 2px;
    }

    main {
      max-width: 900px;
      margin: 60px auto;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 40px 60px;
    }

    h1 {
      color: #1a73e8;
      border-left: 6px solid #1a73e8;
      padding-left: 10px;
      margin-bottom: 25px;
      font-size: 1.6rem;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.9;
      text-indent: 2em;
      color: #444;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      main {
        padding: 30px 25px;
        margin: 30px 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    個人簡介
  </header>

  <main>
    <h1>關於我</h1>
    <p>
      我叫蕭淯庭，是台南人。高中就讀於後壁高中的美工科，
      之後於 2023 年進入台南應用科技大學多媒體動畫系就讀。
    </p>

    <p>
      在學期間，我學習了數位媒體的創作與設計，
      包含動畫分鏡、角色設定、視覺構圖與數位繪圖技巧。
      我熱愛創作，喜歡將想法轉化成畫面，並透過作品傳達情感與故事。
    </p>

    <p>
      我期許自己能在未來的動畫與多媒體領域中發光發熱，
      不斷學習新技術、挑戰自我，創造更具影響力的作品。
    </p>
  </main>

  <footer>
   D12371251 蕭淯庭 — Multimedia & Animation
  </footer>
</body>
</html>
