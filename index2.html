<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蕭淯庭｜研究興趣</title>
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans TC", "微軟正黑體", sans-serif;
      background-color: #e6f2ff; /* 淡藍色背景 */
      color: #333;
    }

    header {
      background: linear-gradient(to right, #1a73e8, #4fc3f7);
      color: white;
      text-align: center;
      padding: 30px 10px;
      font-size: 1.8rem;
      letter-spacing: 2px;
    }

    main {
      max-width: 900px;
      margin: 60px auto;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 40px 60px;
    }

    h1 {
      color: #1a73e8;
      border-left: 6px solid #1a73e8;
      padding-left: 10px;
      margin-bottom: 25px;
      font-size: 1.6rem;
    }

    h2 {
      color: #1a73e8;
      margin-top: 30px;
      margin-bottom: 10px;
      font-size: 1.3rem;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.9;
      text-indent: 2em;
      color: #444;
    }

    ul {
      margin: 20px 0 20px 40px;
      line-height: 1.9;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      main {
        padding: 30px 25px;
        margin: 30px 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    研究興趣
  </header>

  <main>
    <h1>多媒體動畫研究方向</h1>
    <p>
      我的研究興趣主要集中在「多媒體動畫」領域，
      涵蓋角色設計、動畫敘事、影像分鏡與數位媒體互動等面向。
      我希望能透過動畫技術結合視覺設計與故事表現，
      探索動畫如何成為情感與思想的傳遞媒介。
    </p>

  <footer>
    D12371251 蕭淯庭 — Multimedia & Animation
  </footer>
</body>
</html>
